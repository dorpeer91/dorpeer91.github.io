<div class="sectionGallery">
    {{ range . }}
    <section>
        <a href="{{ .RelPermalink }}">
        {{ $coverImage := partial "getCover.html" . }}
        <div class="imageContainer">
          <img src="{{ $coverImage.RelPermalink }}">
        </div>
        <h3>{{ .LinkTitle }}</a></h3>
    </section>
    {{ end }}
</div>
