{{ with where .Pages "Type" "gallery" }}
    <h2>Galleries</h2>
    <div class="subGalleries">
        {{ range . }}
            <a href="{{ .RelPermalink }}">
            <div class="item">

                <div class="cover">
                    {{ $coverImage := partial "getCover.html" . }}

                        <img src="{{ $coverImage.RelPermalink }}">
                    
                </div>

                <div class="details">
                    
                        <h2>{{ .LinkTitle }}</h2>
                    
                </div>

                
            </div>
            </a>
        {{ end }}

    </div>  
{{ end }}
